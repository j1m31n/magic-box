<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Streaming Pro</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
        #contenedor-video { width: 80%; max-width: 800px; border: 2px solid #333; margin-top: 20px; }
        video { width: 100%; height: auto; }
        .controles { margin-top: 15px; }
        button { background: #222; color: #0f0; border: 1px solid #0f0; padding: 10px; cursor: pointer; margin: 5px; }
        button:hover { background: #0f0; color: #000; }
    </style>
</head>
<body>
    <h1>ESTACIÓN DE STREAMING V1.0</h1>
    <div id="contenedor-video">
        <video id="reproductor" controls autoplay>
            Tu navegador no soporta video.
        </video>
    </div>
    <div class="controles">
        <button onclick="cambiarCanal(0)">Canal 1</button>
        <button onclick="cambiarCanal(1)">Canal 2</button>
        <button onclick="cambiarCanal(2)">Canal 3</button>
    </div>

    <script>
        let datosPlaylist;
        const repro = document.getElementById('reproductor');

        // Cargar el cerebro (JSON)
        fetch('playlist.json')
            .then(response => response.json())
            .then(data => {
                datosPlaylist = data;
                console.log("Sistema cargado...");
                cambiarCanal(0); // Empezar con el canal 1
            });

        function cambiarCanal(num) {
            const itemID = atob(datosPlaylist.config.item_id); // Decodifica el Base64
            const videoArchivo = datosPlaylist.canales[num].videos[0].archivo;
            const urlFinal = `https://archive.org{itemID}/${videoArchivo}`;
            
            repro.src = urlFinal;
            repro.play();
            console.log("Cargando: " + urlFinal);
        }
    </script>
</body>
</html>
